name: Job Radar

on:
  repository_dispatch:
    types: [job-radar-hourly]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Scan jobs
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python job_radar.py

      - name: Save updated registry and seen jobs
        run: |
          git config user.name "job-radar-bot"
          git config user.email "bot@users.noreply.github.com"

          git add discovered_ats.json seen_jobs.json

          git diff --staged --quiet || git commit -m "update job radar state"
          git push
